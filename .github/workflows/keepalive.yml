name: Mantener activo el robot

# GitHub pausa las tareas programadas de un repositorio público si pasan 60 días
# sin ningún cambio. Esto hace un pequeño cambio cada mes para evitarlo.
on:
  schedule:
    - cron: '17 14 1 * *'   # el día 1 de cada mes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  latido:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Registrar latido
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/latido.txt
          git config user.name "appsito-bot"
          git config user.email "appsito-bot@users.noreply.github.com"
          git add .github/latido.txt
          git commit -m "Latido mensual del robot de avisos" || echo "Sin cambios"
          git push
