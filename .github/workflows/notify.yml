name: Avisos de Appsito

on:
  schedule:
    - cron: '*/10 * * * *'   # cada 10 minutos (GitHub puede retrasarlo unos minutos)
  workflow_dispatch:
    inputs:
      prueba:
        description: 'Enviar un aviso de prueba a tus dispositivos'
        type: boolean
        default: true

concurrency:
  group: appsito-notify
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  avisos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Revisar y enviar avisos
        run: node scripts/notify.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          OWNER_UID: ${{ secrets.OWNER_UID }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          APPSITO_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.prueba && 'true' || 'false' }}
